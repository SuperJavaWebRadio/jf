<div id="sj-clock">--:--:--</div>
<script>
  setInterval(function(){
    var d = new Date();
    document.getElementById('sj-clock').textContent =
      ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);
  }, 1000);
</script>


<body>

    <div class="bg" aria-hidden="true">

    <main class="app">
        <header class="masthead">

        <section class="player">
            <div class="artwork cover-album">

            <div class="player-info">

                        </button>

        <section class="historic hidden">

                <article>

                    </div>

            </div>
        </section>
    </main>

    <div id="modalLyrics" role="dialog" aria-modal="true" aria-labelledby="lyricsSong" aria-hidden="true">
        <div class="modal-card">
            <header>
                <h3 id="lyricsSong">Letra</h3>
                <button type="button" class="modal-close" aria-label="Fechar">
                    <i class="fa fa-times"></i>
                </button>
            </header>
            <div id="lyric"></div>
        </div>
    </div>

    <script type="text/javascript" src="js/script.js"></script>
    <script>
        // Modal de letra (substitui o modal do Bootstrap; o script.js sinaliza
        // que há letra disponível colocando data-toggle no botão .lyrics)
        (function () {
            var modal = document.getElementById('modalLyrics');
            var openButton = document.querySelector('.lyrics');

            function closeModal() {
                modal.style.display = 'none';
                modal.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('modal-open');
            }

            openButton.addEventListener('click', function (event) {
                event.preventDefault();
                if (!openButton.hasAttribute('data-toggle')) return; // sem letra disponível
                modal.style.display = 'flex';
                modal.setAttribute('aria-hidden', 'false');
                document.body.classList.add('modal-open');
            });

            modal.addEventListener('click', function (event) {
                if (event.target === modal) closeModal();
            });
            modal.querySelector('.modal-close').addEventListener('click', closeModal);
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape') closeModal();
            });
        })();

        // Popover de volume (abre no clique do botão circular, fecha ao clicar fora)
        (function () {
            var wrap = document.querySelector('.volume-wrap');
            var toggle = document.querySelector('.volume-toggle');
            var popover = document.querySelector('.volume-popover');
            if (!wrap || !toggle || !popover) return;

            toggle.addEventListener('click', function () {
                popover.hidden = !popover.hidden;
            });
            document.addEventListener('click', function (event) {
                if (!wrap.contains(event.target)) popover.hidden = true;
            });
        })();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('service-worker.js');
            });
        }
    </script>
        <script>
 // 1. Bloqueia o clique com botão direito
 document.addEventListener('contextmenu', function (e) {
 e.preventDefault();
 });
 // 2. Bloqueia atalhos de teclado comuns (Ctrl+C, Ctrl+V, Ctrl+U, Ctrl+S, F12)
 document.addEventListener('keydown', function (e) {
 if (
 e.key === 'F12' ||
 (e.ctrlKey && (
 e.key === 'c' || 
 e.key === 'C' || 
 e.key === 'v' || 
 e.key === 'V' || 
 e.key === 'u' || 
 e.key === 'U' || 
 e.key === 's' || 
 e.key === 'S'
 ))
 ) {
 e.preventDefault();
 }
 });
</script>
