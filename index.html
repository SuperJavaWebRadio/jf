<style>

html,
body{

font-family:"Open Sans",sans-serif;

height:100%;

margin:0;

display:flex;

flex-direction:column;

background:#000;

color:#ffffff;

overflow:hidden;

}

/* PLAYER */

#player{

width:100%;
height:100%;

/* AJUSTE IMPORTANTE */

display:flex;
justify-content:center;
align-items:center;

padding:80px 20px 80px 20px;

box-sizing:border-box;

}

/* MENU */

.mobile-nav-toggle{

position:fixed;

top:15px;
left:15px;

z-index:9999;

border:none;

background:rgba(0,0,0,.6);

color:#fff;

width:45px;
height:45px;

border-radius:10px;

font-size:20px;

cursor:pointer;

backdrop-filter:blur(10px);

}

/* MENU LATERAL */

#header{

position:fixed;

top:0;
left:-260px;

width:250px;

height:100%;

background:rgba(0,0,0,.95);

z-index:9998;

transition:.4s;

padding-top:80px;

backdrop-filter:blur(15px);

overflow-y:auto;

}

body.mobile-nav-active #header{

left:0;

}

.nav-menu ul{

list-style:none;

padding:0;

margin:0;

}

.nav-menu li{

padding:12px 20px;

border-bottom:
1px solid rgba(255,255,255,.05);

}

.nav-menu a{

color:#fff;

text-decoration:none;

display:flex;

align-items:center;

gap:12px;

font-size:16px;

transition:.3s;

}

.nav-menu a:hover{

color:#00ff88;

padding-left:5px;

}

.nav-menu i{

font-size:22px;

}

/* RELÓGIO */

.background_hora{

position:fixed;

top:15px;
right:15px;

z-index:9999;

background:rgba(0,0,0,.55);

padding:10px 18px;

border-radius:12px;

backdrop-filter:blur(10px);

font-size:18px;

font-weight:bold;

color:#00ff88;

}

/* FOOTER */

footer{

position:fixed;

bottom:0;
left:0;

width:100%;

z-index:9999;

}

footer div{

background:rgba(0,0,0,.88);

color:#fff;

text-align:center;

padding:12px;

font-size:14px;

backdrop-filter:blur(10px);

}

footer a{

color:#00ff88;

text-decoration:none;

}

footer a:hover{

text-decoration:underline;

}

/* AJUSTE PLAYER LUNARADIO */

.lr-player{

max-width:100% !important;

width:100% !important;

height:auto !important;

margin:auto !important;

}

/* CAPA */

.lr-cover{

border-radius:18px !important;

overflow:hidden;

box-shadow:
0 0 30px rgba(0,0,0,.5);

max-width:100% !important;

}

/* BOTÃO PLAY */

.lr-play-btn{

background:#00ff88 !important;

}

.lr-play-btn i{

color:#000 !important;

}

/* CONTROLES */

.lr-controls{

display:flex !important;

justify-content:center !important;

align-items:center !important;

flex-wrap:wrap !important;

gap:10px !important;

width:100% !important;

padding:10px 0 !important;

}

/* TEXTO */

.lr-title,
.lr-artists{

word-break:break-word !important;

text-align:center !important;

padding:0 10px !important;

}

/* RESPONSIVO */

@media(max-width:768px){

#player{

padding:90px 10px 90px 10px;

}

.background_hora{

font-size:14px;

padding:8px 14px;

}

.lr-player{

transform:scale(.92);

}

}

@media(max-width:480px){

.lr-player{

transform:scale(.82);

}

}

</style>
