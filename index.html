<body>

    <!-- MENU NATIVO DE 3 TRACINHOS (CANTO SUPERIOR ESQUERDO) -->
    <details class="menu-social-nativo" id="menuSocialNativo">
        <summary aria-label="Redes Sociais" title="Redes Sociais">
            <i class="fa fa-bars"></i>
        </summary>

        <!-- TROQUE OS LINKS ABAIXO PELOS SEUS LINKS REAIS -->
        <div class="lista-redes">
            <a href="https://wa.me" target="_blank" rel="noopener noreferrer">
                <i class="fa fa-whatsapp" style="color: #25D366;"></i> WhatsApp
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                <i class="fa fa-instagram" style="color: #E1306C;"></i> Instagram
            </a>
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                <i class="fa fa-facebook-square" style="color: #1877F2;"></i> Facebook
            </a>
            <a href="https://youtube.com" target="_blank" rel="noopener noreferrer">
                <i class="fa fa-youtube-play" style="color: #FF0000;"></i> YouTube
            </a>
        </div>
    </details>

    <!-- RELÓGIO DIGITAL NO CANTO SUPERIOR DIREITO -->
    <div id="relogio-digital">--:--:--</div>

    <div class="bg" aria-hidden="true">
        <div id="bgCover"></div>
        <div class="bg-overlay"></div>
    </div>

    <main class="app">
        <header class="masthead">
            <span id="radioName">Super Java Web Rádio</span>
        </header>

        <section class="player">
            <div class="artwork cover-album">
                <div id="currentCoverArt" style="background-image: url('img/cover.png');"></div>
            </div>

            <div class="player-info">
                <span class="live-badge"><span class="live-dot"></span> AO VIVO</span>
                <h1 id="currentSong" class="text-uppercase">Super Java Web Rádio</h1>
                <h2 id="currentArtist" class="text-capitalize">Ao Vivo</h2>

                <div class="controls">
                    <div class="control-cluster">
                        <div class="volume-wrap volume-control">
                            <button type="button" class="ctrl-btn volume-toggle" aria-label="Volume" title="Volume">
                                <i class="fa fa-volume-up"></i>
                            </button>
                            <div class="volume-popover" hidden>
                                <input type="range" id="volume" step="1" min="0" max="100" value="80" aria-label="Volume">
                                <span class="vol-value"><span id="volIndicator">80</span>%</span>
                            </div>
                        </div>

                        <button type="button" class="play-btn" id="btnPlayPause" aria-label="Tocar ou pausar">
                            <i id="playerButton" class="fa fa-play"></i>
                        </button>

                        <button type="button" class="ctrl-btn lyrics" title="Letra da música" aria-label="Letra da música">
                            <i class="fa fa-music"></i>
                        </button>
                    </div>
                    <span id="buttonPlay" class="sr-only" aria-live="polite">PLAY</span>
                </div>
            </div>
        </section>

        <section class="historic hidden" id="secaoHistorico">
            <h2 class="section-title">Tocadas recentemente</h2>
            <div class="history-list" id="historicSong"></div>
        </section>
