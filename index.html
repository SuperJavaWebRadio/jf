<!doctype html>
<html lang="pt-BR">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, user-scalable=no"
>

<meta
name="theme-color"
content="#00ff88"
>

<title>SUPER JAVA WEB RÁDIO</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet"
>

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
rel="stylesheet"
>

<style>

html,
body{

margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;

font-family:'Poppins',sans-serif;

background:#000;

color:#fff;

display:flex;
justify-content:center;
align-items:center;

}

*{
box-sizing:border-box;
}

.background{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:
url('https://i.postimg.cc/NFRjKKMY/LOGO-SITE1.png')
center center/cover;

filter:
blur(35px)
brightness(.25);

transform:scale(1.2);

transition:1s;

}

.player{

position:relative;

width:390px;

background:
rgba(10,10,10,.78);

backdrop-filter:blur(18px);

border-radius:30px;

padding:25px;

z-index:2;

border:
1px solid rgba(255,255,255,.08);

box-shadow:
0 0 40px rgba(0,255,136,.15);

}

.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}

.logo{

font-size:22px;

font-weight:700;

color:#00ff88;

}

.live{

font-size:13px;

font-weight:600;

color:#00ff88;

animation:pulse 1s infinite;

}

@keyframes pulse{

50%{
opacity:.4;
}

}

.cover{

width:100%;

height:340px;

overflow:hidden;

border-radius:25px;

box-shadow:
0 0 35px rgba(0,0,0,.5);

}

.cover img{

width:100%;
height:100%;

object-fit:cover;

transition:1s;

}

.music{

margin-top:22px;

overflow:hidden;

}

.music-name{

overflow:hidden;

white-space:nowrap;

}

.music-name span{

display:inline-block;

padding-left:100%;

animation:scroll 12s linear infinite;

font-size:24px;

font-weight:700;

}

@keyframes scroll{

100%{
transform:translateX(-100%);
}

}

.artist{

margin-top:8px;

text-align:center;

font-size:15px;

color:#ccc;

}

.controls{

display:flex;

justify-content:center;

align-items:center;

margin-top:25px;

}

.play-btn{

width:85px;
height:85px;

border:none;

border-radius:50%;

background:#00ff88;

color:#000;

font-size:32px;

cursor:pointer;

transition:.3s;

box-shadow:
0 0 30px rgba(0,255,136,.4);

}

.play-btn:hover{

transform:scale(1.08);

}

.volume{

margin-top:22px;

}

.volume input{

width:100%;

accent-color:#00ff88;

}

.social{

display:flex;

justify-content:center;

gap:18px;

margin-top:25px;

}

.social a{

color:#fff;

font-size:24px;

transition:.3s;

}

.social a:hover{

color:#00ff88;

transform:translateY(-3px);

}

.clock{

text-align:center;

margin-top:18px;

font-size:15px;

color:#ccc;

}

.footer{

margin-top:18px;

text-align:center;

font-size:12px;

color:#777;

}

@media(max-width:450px){

.player{

width:92%;

padding:20px;

}

.cover{

height:290px;

}

.music-name span{

font-size:20px;

}

}

</style>

</head>

<body>

<div class="background"></div>

<div class="player">

<div class="header">

<div class="logo">
SUPER JAVA WEB RÁDIO
</div>

<div class="live">
● AO VIVO
</div>

</div>

<div class="cover">

<img
id="albumCover"
src="https://i.postimg.cc/NFRjKKMY/LOGO-SITE1.png"
alt="Capa do Álbum"
>

</div>

<div class="music">

<div class="music-name">

<span id="musicTitle">

Carregando música...

</span>

</div>

<div
class="artist"
id="artistName"
>

Carregando artista...

</div>

</div>

<div class="controls">

<button
class="play-btn"
id="playButton"
>

▶

</button>

</div>

<div class="volume">

<input
type="range"
id="volumeControl"
min="0"
max="1"
step="0.01"
value="1"
>

</div>

<div class="social">

<a
href="https://www.facebook.com/superjavawebradio"
target="_blank"
>

<i class="fab fa-facebook"></i>

</a>

<a
href="https://www.instagram.com/"
target="_blank"
>

<i class="fab fa-instagram"></i>

</a>

<a
href="https://wa.me/5532991333934"
target="_blank"
>

<i class="fab fa-whatsapp"></i>

</a>

</div>

<div
class="clock"
id="clock"
>

00:00:00

</div>

<div class="footer">

© 2026 SUPER JAVA WEB RÁDIO

</div>

</div>

<audio id="radioPlayer">

<source
src="https://stream-178.zeno.fm/ego2eudayomtv"
type="audio/mpeg"
>

</audio>

<script>

const radio =
document.getElementById("radioPlayer");

const playButton =
document.getElementById("playButton");

const volumeControl =
document.getElementById("volumeControl");

const musicTitle =
document.getElementById("musicTitle");

const artistName =
document.getElementById("artistName");

const albumCover =
document.getElementById("albumCover");

const background =
document.querySelector(".background");

let playing = false;

playButton.addEventListener("click", async () => {

if(!playing){

await radio.play();

playButton.innerHTML = "❚❚";

playing = true;

}else{

radio.pause();

playButton.innerHTML = "▶";

playing = false;

}

});

volumeControl.addEventListener("input", () => {

radio.volume = volumeControl.value;

});

function updateClock(){

const now = new Date();

document.getElementById("clock")
.innerHTML =
now.toLocaleTimeString("pt-BR");

}

setInterval(updateClock,1000);

async function getNowPlaying(){

try{

const response = await fetch(
"https://corsproxy.io/?https://zenoplay.zenomedia.com/api/zenofm/nowplaying/ego2eudayomtv"
);

const data =
await response.json();

const currentSong =
data.title || "SUPER JAVA WEB RÁDIO";

let artist =
"SUPER JAVA WEB RÁDIO";

let song =
currentSong;

if(currentSong.includes("-")){

artist =
currentSong.split("-")[0].trim();

song =
currentSong.split("-")[1].trim();

}

musicTitle.innerHTML = song;

artistName.innerHTML = artist;

const coverRequest = await fetch(
`https://itunes.apple.com/search?term=${encodeURIComponent(currentSong)}&media=music&limit=1`
);

const coverData =
await coverRequest.json();

if(coverData.results.length > 0){

const cover =
coverData.results[0]
.artworkUrl100
.replace("100x100","600x600");

albumCover.src = cover;

background.style.backgroundImage =
`url('${cover}')`;

}

}catch(error){

console.log(error);

}

}

getNowPlaying();

setInterval(getNowPlaying,10000);

</script>

</body>
</html>
