<style>

html,
body{

font-family:"Open Sans",sans-serif;

height:100%;

margin:0;

display:flex;

flex-direction:column;

background:#000;

color:#ffffff;

overflow:hidden;

}

/* PLAYER */

#player{

width:100%;
height:100%;

display:flex;
justify-content:center;
align-items:center;

padding:80px 20px 80px 20px;

box-sizing:border-box;

}

/* BOTÃO MENU */

.mobile-nav-toggle{

position:fixed;

top:15px;
left:15px;

z-index:9999;

border:none;

background:rgba(0,0,0,.6);

color:#fff;

width:48px;
height:48px;

border-radius:12px;

font-size:20px;

cursor:pointer;

backdrop-filter:blur(10px);

}

/* MENU LATERAL */

#header{

position:fixed;

top:0;
left:-270px;

width:260px;

height:100%;

background:rgba(0,0,0,.96);

z-index:9998;

transition:.4s;

padding-top:80px;

backdrop-filter:blur(15px);

overflow-y:auto;

overflow-x:hidden;

}

body.mobile-nav-active #header{

left:0;

}

/* MENU */

.nav-menu{

width:100%;

padding-bottom:30px;

}

.nav-menu ul{

list-style:none;

padding:0;

margin:0;

display:flex;

flex-direction:column;

gap:12px;

}

/* ITENS */

.nav-menu li{

width:100%;

padding:0 15px;

box-sizing:border-box;

}

/* LINKS */

.nav-menu a{

width:100%;

display:flex;

align-items:center;

gap:15px;

padding:15px;

border-radius:14px;

background:rgba(255,255,255,.05);

color:#ffffff;

text-decoration:none;

font-size:16px;

font-weight:600;

transition:.3s;

box-sizing:border-box;

}

/* ÍCONES */

.nav-menu a i{

font-size:24px;

min-width:30px;

text-align:center;

}

/* TEXTO */

.nav-menu a span{

display:block;

white-space:nowrap;

}

/* HOVER */

.nav-menu a:hover{

background:rgba(0,255,136,.15);

color:#00ff88;

transform:translateX(5px);

}

/* RELÓGIO */

.background_hora{

position:fixed;

top:15px;
right:15px;

z-index:9999;

background:rgba(0,0,0,.55);

padding:10px 18px;

border-radius:12px;

backdrop-filter:blur(10px);

font-size:18px;

font-weight:bold;

color:#00ff88;

}

/* FOOTER */

footer{

position:fixed;

bottom:0;
left:0;

width:100%;

z-index:9999;

}

footer div{

background:rgba(0,0,0,.88);

color:#fff;

text-align:center;

padding:12px;

font-size:14px;

backdrop-filter:blur(10px);

}

footer a{

color:#00ff88;

text-decoration:none;

}

footer a:hover{

text-decoration:underline;

}

/* AJUSTE PLAYER */

.lr-player{

max-width:100% !important;

width:100% !important;

height:auto !important;

margin:auto !important;

}

.lr-cover{

border-radius:18px !important;

overflow:hidden;

box-shadow:
0 0 30px rgba(0,0,0,.5);

max-width:100% !important;

}

.lr-play-btn{

background:#00ff88 !important;

}

.lr-play-btn i{

color:#000 !important;

}

.lr-controls{

display:flex !important;

justify-content:center !important;

align-items:center !important;

flex-wrap:wrap !important;

gap:10px !important;

width:100% !important;

padding:10px 0 !important;

}

.lr-title,
.lr-artists{

word-break:break-word !important;

text-align:center !important;

padding:0 10px !important;

}

/* RESPONSIVO */

@media(max-width:768px){

#player{

padding:90px 10px 90px 10px;

}

.background_hora{

font-size:14px;

padding:8px 14px;

}

.lr-player{

transform:scale(.92);

}

#header{

width:250px;

}

.nav-menu a{

font-size:15px;

padding:14px;

}

.nav-menu a i{

font-size:22px;

}

}

@media(max-width:480px){

.lr-player{

transform:scale(.82);

}

}

</style>
