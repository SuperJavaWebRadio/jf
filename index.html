/* MENU */

.mobile-nav-toggle{

position:fixed;

top:15px;
left:15px;

z-index:9999;

width:48px;
height:48px;

border:none;

border-radius:12px;

background:rgba(0,0,0,.65);

font-size:20px;

cursor:pointer;

}

/* MENU LATERAL */

#header{

position:fixed;

top:0;
left:-270px;

width:260px;

height:100%;

background:rgba(0,0,0,.95);

transition:.4s;

z-index:9998;

padding-top:80px;

overflow-y:auto;

}

body.mobile-nav-active #header{

left:0;

}

/* LINKS */

.nav-menu ul{

list-style:none;

padding:0;

margin:0;

}

.nav-menu li{

padding:10px 15px;

}

.nav-menu a{

display:flex;

align-items:center;

gap:15px;

padding:14px;

border-radius:12px;

background:rgba(255,255,255,.05);

color:#fff;

text-decoration:none;

font-size:16px;

transition:.3s;

}

.nav-menu a:hover{

background:rgba(0,255,136,.15);

color:#00ff88;

}

.nav-menu i{

font-size:22px;

min-width:25px;

}

/* RELÓGIO */

.background_hora{

position:fixed;

top:15px;
right:15px;

z-index:9999;

background:rgba(0,0,0,.60);

padding:10px 15px;

border-radius:10px;

color:#00ff88;

font-weight:bold;

}

/* FOOTER */

footer{

position:fixed;

bottom:0;
left:0;

width:100%;

z-index:9999;

}

footer div{

background:rgba(0,0,0,.85);

padding:10px;

text-align:center;

}

footer a{

/* AJUSTE PLAYER */

}

.lr-play-btn{

@media(max-width:480px){
