<!doctype html>
<html lang="pt-BR">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, user-scalable=no"
>

<meta
name="theme-color"
content="#00ff88"
>

<title>SUPER JAVA WEB RÁDIO</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet"
>

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
rel="stylesheet"
>

<style>

html,
body{

margin:0;
padding:0;

width:100%;
height:100%;

overflow:hidden;

font-family:'Poppins',sans-serif;

background:#000;

color:#fff;

}

*{
box-sizing:border-box;
}

.background{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:
url('https://i.postimg.cc/NFRjKKMY/LOGO-SITE1.png')
center center/cover;

filter:
blur(40px)
brightness(.20);

transform:scale(1.2);

transition:1s;

z-index:1;

}

.player{

position:relative;

width:100%;
height:100%;

display:flex;

justify-content:center;
align-items:center;

padding:40px;

z-index:2;

}

.container{

width:100%;
height:100%;

display:flex;

align-items:center;
justify-content:center;

gap:50px;

background:
rgba(0,0,0,.45);

backdrop-filter:blur(15px);

border-radius:0;

padding:40px;

}

/* CAPA */

.cover{

width:45%;
height:100%;

display:flex;
justify-content:center;
align-items:center;

}

.cover img{

width:100%;
max-width:650px;

height:auto;

border-radius:30px;

box-shadow:
0 0 40px rgba(0,0,0,.6);

animation:zoom 8s infinite alternate;

}

@keyframes zoom{

100%{
transform:scale(1.03);
}

}

/* INFO */

.info{

width:45%;

display:flex;

flex-direction:column;

justify-content:center;

}

.logo{

font-size:55px;

font-weight:700;

color:#00ff88;

line-height:1.1;

margin-bottom:20px;

}

.live{

font-size:18px;

font-weight:600;

color:#00ff88;

margin-bottom:25px;

animation:pulse 1s infinite;

}

@keyframes pulse{

50%{
opacity:.4;
}

}

.music{

overflow:hidden;

white-space:nowrap;

margin-bottom:10px;

}

.music span{

display:inline-block;

padding-left:100%;

animation:scroll 12s linear infinite;

font-size:45px;

font-weight:700;

}

@keyframes scroll{

100%{
transform:translateX(-100%);
}

}

.artist{

font-size:25px;

color:#ccc;

margin-bottom:35px;

}

.controls{

display:flex;

align-items:center;

gap:25px;

margin-bottom:35px;

}

.play-btn{

width:100px;
height:100px;

border:none;

border-radius:50%;

background:#00ff88;

color:#000;

font-size:38px;

cursor:pointer;

transition:.3s;

box-shadow:
0 0 35px rgba(0,255,136,.5);

}

.play-btn:hover{

transform:scale(1.08);

}

.control-icon{

font-size:30px;

color:#fff;

}

/* VOLUME */

.volume{

width:100%;

margin-bottom:35px;

}

.volume input{

width:100%;

accent-color:#00ff88;

}

/* SOCIAL */

.social{

display:flex;

gap:20px;

margin-bottom:30px;

}

.social a{

color:#fff;

font-size:32px;

transition:.3s;

}

.social a:hover{

color:#00ff88;

transform:translateY(-3px);

}

/* CLOCK */

.clock{

font-size:22px;

color:#ddd;

margin-bottom:10px;

}

/* FOOTER */

.footer{

font-size:14px;

color:#777;

}

/* RESPONSIVO */

@media(max-width:1100px){

.container{

flex-direction:column;

overflow:auto;

padding:30px;

}

.cover{

width:100%;

height:auto;

}

.cover img{

max-width:400px;

}

.info{

width:100%;

text-align:center;

align-items:center;

}

.logo{

font-size:38px;

}

.music span{

font-size:28px;

}

.artist{

font-size:20px;

}

}

</style>

</head>

<body>

<div class="background"></div>

<div class="player">

<div class="container">

<div class="cover">

<img
id="albumCover"
src="https://i.postimg.cc/NFRjKKMY/LOGO-SITE1.png"
alt="Capa do Álbum"
>

</div>

<div class="info">

<div class="logo">

SUPER JAVA<br>
WEB RÁDIO

</div>

<div class="live">

● AO VIVO

</div>

<div class="music">

<span id="musicTitle">

Carregando música...

</span>

</div>

<div
class="artist"
id="artistName"
>

Carregando artista...

</div>

<div class="controls">

<i class="fas fa-headphones control-icon"></i>

<button
class="play-btn"
id="playButton"
>

▶

</button>

<i class="fas fa-music control-icon"></i>

</div>

<div class="volume">

<input
type="range"
id="volumeControl"
min="0"
max="1"
step="0.01"
value="1"
>

</div>

<div class="social">

<a
href="https://www.facebook.com/superjavawebradio"
target="_blank"
>

<i class="fab fa-facebook"></i>

</a>

<a
href="https://www.instagram.com/"
target="_blank"
>

<i class="fab fa-instagram"></i>

</a>

<a
href="https://wa.me/5532991333934"
target="_blank"
>

<i class="fab fa-whatsapp"></i>

</a>

</div>

<div
class="clock"
id="clock"
>

00:00:00

</div>

<div class="footer">

© 2026 SUPER JAVA WEB RÁDIO

</div>

</div>

</div>

</div>

<audio id="radioPlayer">

<source
src="https://stream-178.zeno.fm/ego2eudayomtv?zt=eyJhbGciOiJIUzI1NiJ9.eyJzdHJlYW0iOiJlZ28yZXVkYXlvbXR2IiwiaG9zdCI6InN0cmVhbS0xNzYuemVuby5mbSIsInJ0dGwiOjUsImp0aSI6Ik90bmV5MUUyVGhxc29LVUIySGIzMHciLCJpYXQiOjE3NzE1MzEwMTUsImV4cCI6MTc3MTUzMTA3NX0._q_maVvje0NYlmG53PKlWZEBr_pb4qzusNaUotonQKo"
type="audio/mpeg"
>

</audio>

<script>

const radio =
document.getElementById("radioPlayer");

const playButton =
document.getElementById("playButton");

const volumeControl =
document.getElementById("volumeControl");

const musicTitle =
document.getElementById("musicTitle");

const artistName =
document.getElementById("artistName");

const albumCover =
document.getElementById("albumCover");

const background =
document.querySelector(".background");

let playing = false;

playButton.addEventListener("click", async () => {

if(!playing){

await radio.play();

playButton.innerHTML = "❚❚";

playing = true;

}else{

radio.pause();

playButton.innerHTML = "▶";

playing = false;

}

});

volumeControl.addEventListener("input", () => {

radio.volume = volumeControl.value;

});

function updateClock(){

const now = new Date();

document.getElementById("clock")
.innerHTML =
now.toLocaleTimeString("pt-BR");

}

setInterval(updateClock,1000);

async function getNowPlaying(){

try{

const response = await fetch(
"https://corsproxy.io/?https://zenoplay.zenomedia.com/api/zenofm/nowplaying/ego2eudayomtv"
);

const data =
await response.json();

const currentSong =
data.title || "SUPER JAVA WEB RÁDIO";

let artist =
"SUPER JAVA WEB RÁDIO";

let song =
currentSong;

if(currentSong.includes("-")){

artist =
currentSong.split("-")[0].trim();

song =
currentSong.split("-")[1].trim();

}

musicTitle.innerHTML = song;

artistName.innerHTML = artist;

const coverRequest = await fetch(
`https://itunes.apple.com/search?term=${encodeURIComponent(currentSong)}&media=music&limit=1`
);

const coverData =
await coverRequest.json();

if(coverData.results.length > 0){

const cover =
coverData.results[0]
.artworkUrl100
.replace("100x100","600x600");

albumCover.src = cover;

background.style.backgroundImage =
`url('${cover}')`;

}

}catch(error){

console.log(error);

}

}

getNowPlaying();

setInterval(getNowPlaying,10000);

</script>

</body>
</html>
