<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Super Java Web Rádio</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="js/lunaradio-animado.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:#0f172a;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

/* APP CONTAINER */

.app{
    max-width:430px;
    margin:auto;
    min-height:100vh;
    background:linear-gradient(180deg,#111827,#0f172a);
    position:relative;
    overflow:hidden;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
}

/* TOP */

.top{
    padding:25px 20px;
    text-align:center;
}

.top h1{
    font-size:28px;
    margin-top:15px;
    font-weight:700;
}

.top p{
    color:#94a3b8;
    margin-top:8px;
    font-size:14px;
}

/* LOGO */

.logo{
    width:140px;
    height:140px;
    margin:auto;
    border-radius:50%;
    overflow:hidden;
    border:4px solid rgba(255,255,255,0.1);
    box-shadow:
    0 0 25px rgba(0,255,170,0.4),
    0 0 50px rgba(0,198,255,0.3);
    animation:pulse 3s infinite;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.04);
    }

    100%{
        transform:scale(1);
    }

}

/* PLAYER */

.player-box{
    margin:20px;
    padding:20px;
    border-radius:25px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

#player{
    width:100%;
}

/* STATUS */

.live{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:18px;
    font-size:14px;
    color:#22c55e;
    font-weight:600;
}

.live-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#22c55e;
    animation:blink 1s infinite;
}

@keyframes blink{

    0%{
        opacity:1;
    }

    50%{
        opacity:0.3;
    }

    100%{
        opacity:1;
    }

}

/* CLOCK */

.clock{
    margin-top:20px;
    text-align:center;
    font-size:30px;
    font-weight:bold;
    letter-spacing:2px;
}

/* SOCIAL */

.social{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    padding:25px 20px;
}

.social a{
    background:rgba(255,255,255,0.05);
    border-radius:18px;
    padding:18px 10px;
    text-align:center;
    text-decoration:none;
    color:#fff;
    transition:0.3s;
    border:1px solid rgba(255,255,255,0.05);
}

.social a:hover{
    transform:translateY(-4px);
    background:#00c6ff;
    color:#000;
}

.social i{
    font-size:22px;
    margin-bottom:8px;
    display:block;
}

.social span{
    font-size:13px;
    font-weight:600;
}

/* FOOTER */

.footer{
    text-align:center;
    padding:25px 20px;
    color:#64748b;
    font-size:13px;
}

/* MOBILE BAR */

.bottom-bar{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:430px;
    background:rgba(17,24,39,0.95);
    backdrop-filter:blur(15px);
    display:flex;
    justify-content:space-around;
    padding:14px 0;
    border-top:1px solid rgba(255,255,255,0.08);
}

.bottom-bar a{
    color:#94a3b8;
    text-decoration:none;
    font-size:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    transition:0.3s;
}

.bottom-bar a:hover{
    color:#00c6ff;
}

.bottom-bar i{
    font-size:18px;
}

</style>
</head>

<body>

<div class="app">

    <div class="top">

        <div class="logo">
            <img src="https://i.postimg.cc/NFRjKKMY/LOGO-SITE1.png" alt="Logo Rádio">
        </div>

        <h1>Super Java Web Rádio</h1>

        <p>Música • Entretenimento • 24 Horas no Ar</p>

    </div>

    <div class="player-box">

        <div id="player"></div>

        <div class="live">

            AO VIVO AGORA

            00:00:00

    </div>

    <div class="social">

        <a href="https://play.google.com/store/apps" target="_blank">
            <i class="fab fa-google-play"></i>
            <span>APP</span>
        </a>

        <a href="https://www.facebook.com/superjavawebradio" target="_blank">
            <i class="fab fa-facebook-f"></i>
            <span>Facebook</span>
        </a>

        <a href="https://www.instagram.com/" target="_blank">
            <i class="fab fa-instagram"></i>
            <span>Instagram</span>
        </a>

        <a href="https://wa.me/5532991333934" target="_blank">
            <i class="fab fa-whatsapp"></i>
            <span>WhatsApp</span>
        </a>

    </div>

    <div class="footer">
        © 2026 Super Java Web Rádio
    </div>

</div>

<!-- MENU MOBILE -->

<div class="bottom-bar">

    <a href="#">
        <i class="fas fa-home"></i>
        <span>Início</span>
    </a>

    <a href="#">
        <i class="fas fa-music"></i>
        <span>Player</span>
    </a>

    <a href="#">
        <i class="fas fa-headphones"></i>
        <span>Ao Vivo</span>
    </a>

    <a href="#">
        <i class="fas fa-share-alt"></i>
        <span>Compartilhar</span>
    </a>

</div>

</body>
</html>
