<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Java Web Rádio</title>
    <link rel="icon" href="https://i.postimg.cc/NFRjKKMY/LOGO-SITE1" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e1e24, #121216);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo-radio {
            max-width: 320px;
            max-height: 220px;
            width: auto;
            height: auto;
            margin-bottom: 20px;
            object-fit: contain;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #ff5e62;
        }
        p {
            font-size: 1rem;
            color: #cccccc;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .status-badge {
            display: inline-block;
            background-color: #ff5e62;
            color: #fff;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }
        .player-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .player-box p {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: bold;
        }
        .now-playing {
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            color: #28a745;
            font-weight: bold;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        audio {
            width: 100%;
            height: 40px;
            outline: none;
        }
        .btn-ouvir {
            display: inline-block;
            background-color: #28a745;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 25px;
            transition: background 0.3s ease;
        }
        .btn-ouvir:hover {
            background-color: #218838;
        }
        .contact-info {
            font-size: 0.9rem;
            color: #888888;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://i.postimg.cc/NFRjKKMY/LOGO-SITE1" alt="Logo da Rádio" class="logo-radio">
        
        <br>
        <span class="status-badge">Site em Manutenção</span>
        <h1>Estamos atualizando nosso site!</h1>
        <p>Nosso portal passa por melhorias, mas a nossa programação continua 24 horas no ar. Continue ouvindo abaixo:</p>
        
        <div class="player-box">
            <p>Ouça agora mesmo:</p>
            <div class="now-playing" id="track-info">
                🎵 Carregando programação...
            </div>
            <audio id="radio-player" controls preload="none">
                <source src="https://stream.zeno.fm/ego2eudayomtv" type="audio/mpeg">
                Seu navegador não suporta o player de áudio.
            </audio>
        </div>

        <a href="https://stream.zeno.fm/ego2eudayomtv" target="_blank" rel="noopener noreferrer" class="btn-ouvir">
             Abrir Rádio em Nova Aba
        </a>

        <div class="contact-info">
            <p>Dúvidas ou pedidos musicais:<br>
            <strong>superjavajf@gmail.com</strong></p>
        </div>
    </div>

    <script>
        // 1. Conexão com a API de Metadados da Zeno.FM
        const mountPoint = 'ego2eudayomtv';
        const metadataUrl = `https://stream.zeno.fm/ego2eudayomtv{mountPoint}`;
        const trackInfoElement = document.getElementById('track-info');

        function iniciarMetadados() {
            const eventSource = new EventSource(metadataUrl);

            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data && data.streamTitle) {
                        const musicaAtual = data.streamTitle;
                        trackInfoElement.textContent = `🎵 ${musicaAtual}`;
                        atualizarMediaSession(musicaAtual);
                    }
                } catch (e) {
                    console.error('Erro ao ler metadados:', e);
                }
            };

            eventSource.onerror = function() {
                trackInfoElement.textContent = '🎵 Super Java Web Rádio - Ao Vivo';
                eventSource.close();
                setTimeout(iniciarMetadados, 10000);
            };
        }

        // 2. Atualiza o player nativo do celular/navegador mantendo apenas a logo da rádio
        function atualizarMediaSession(tituloCompleto) {
            if ('mediaSession' in navigator) {
                let artista = 'Super Java Web Rádio';
                let musica = tituloCompleto;

                if (tituloCompleto.includes(' - ')) {
                    const partes = tituloCompleto.split(' - ');
                    artista = partes[0].trim();
                    musica = partes.slice(1).join(' - ').trim();
                }

                navigator.mediaSession.metadata = new MediaMetadata({
                    title: musica,
                    artist: artista,
                    album: 'Essa Sim é Super!',
                    artwork: [
                        { src: 'https://i.postimg.cc/NFRjKKMY/LOGO-SITE1', sizes: '512x512', type: 'image/png' }
                    ]
                });
            }
        }

        iniciarMetadados();

        // 3. Proteções de clique direito e atalhos
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function (e) {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && (
                    e.key === 'c' || e.key === 'C' || 
                    e.key === 'v' || e.key === 'V' || 
                    e.key === 'u' || e.key === 'U' || 
                    e.key === 's' || e.key === 'S'
                ))
            ) {
                e.preventDefault();
            }
        });
    </script> 

</body>
</html>
