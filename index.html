<style>

/* REDES SOCIAIS */

.nav-menu{

width:100%;

}

.nav-menu ul{

list-style:none;

padding:0;

margin:0;

display:flex;

flex-direction:column;

gap:10px;

}

.nav-menu li{

width:100%;

padding:0 15px;

box-sizing:border-box;

}

.nav-menu a{

width:100%;

display:flex;

align-items:center;

gap:12px;

padding:14px 15px;

border-radius:12px;

background:rgba(255,255,255,.05);

color:#ffffff;

text-decoration:none;

font-size:16px;

transition:.3s;

box-sizing:border-box;

overflow:hidden;

}

/* ÍCONES */

.nav-menu a i{

font-size:22px;

min-width:30px;

text-align:center;

}

/* TEXTO */

.nav-menu a span{

display:block;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

}

/* HOVER */

.nav-menu a:hover{

background:rgba(0,255,136,.15);

color:#00ff88;

transform:translateX(5px);

}

/* AJUSTE MENU */

#header{

overflow-y:auto;

overflow-x:hidden;

}

/* RESPONSIVO */

@media(max-width:768px){

#header{

width:260px;

}

.nav-menu a{

font-size:15px;

padding:13px 14px;

}

}

</style>
